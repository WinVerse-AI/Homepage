<g transform="translate(1085 842)"><rect width="425" height="145" class="box"/><text x="16" y="24" class="ts">• Four output channels are represented as charge-balanced and current-controlled.</text><text x="16" y="48" class="ts">• Isolation, compliance monitoring and short-circuit protection are design targets.</text><text x="16" y="72" class="ts">• Component identities, pinouts, dimensions and stack-up remain provisional.</text><text x="16" y="96" class="ts">• Verification must address IEC 60601-1 and applicable stimulator requirements.</text><text x="16" y="120" class="ts bold">For research and development use only.</text></g>
