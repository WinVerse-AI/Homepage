name: Build SerotoniX high-resolution gallery

on:
  push:
    branches:
      - agent/serotonix-high-resolution-assets

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/serotonix-high-resolution-assets
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --upgrade pillow

      - name: Generate high-resolution gallery assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          root = Path('.')
          asset_dir = root / 'assets'
          mapping = [
              ('serotonix-concept-exploded.webp', 'serotonix-concept-exploded-hires.webp'),
              ('serotonix-system-schematic.webp', 'serotonix-system-schematic-hires.webp'),
              ('serotonix-pcba-concept.webp', 'serotonix-pcba-concept-hires.webp'),
              ('serotonix-cad-concept.webp', 'serotonix-cad-concept-hires.webp'),
              ('serotonix-proposed-specifications.webp', 'serotonix-proposed-specifications-hires.webp'),
              ('serotonix-colour-concepts.webp', 'serotonix-colour-concepts-hires.webp'),
          ]

          output_sizes = {}
          for source_name, target_name in mapping:
              source = asset_dir / source_name
              target = asset_dir / target_name
              image = Image.open(source).convert('RGB')
              target_long_edge = 2200
              scale = max(1.0, target_long_edge / max(image.size))
              size = (round(image.width * scale), round(image.height * scale))
              image = image.resize(size, Image.Resampling.LANCZOS)
              image = image.filter(ImageFilter.UnsharpMask(radius=1.25, percent=145, threshold=2))
              image.save(target, 'WEBP', quality=95, method=6)
              output_sizes[target_name] = image.size

          # Build a dedicated dimensions panel from the proposed CAD study.
          cad = Image.open(asset_dir / 'serotonix-cad-concept-hires.webp').convert('RGB')
          width, height = cad.size
          top_crop = cad.crop((0, int(height * 0.03), int(width * 0.35), int(height * 0.39)))
          side_crop = cad.crop((int(width * 0.65), int(height * 0.03), width, int(height * 0.39)))

          canvas = Image.new('RGB', (1800, 2400), 'white')
          draw = ImageDraw.Draw(canvas)
          try:
              title_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 76)
              label_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 54)
          except OSError:
              title_font = ImageFont.load_default()
              label_font = ImageFont.load_default()

          green = '#006b4f'
          draw.text((80, 60), 'DIMENSIONS', fill=green, font=title_font)

          top_crop.thumbnail((1320, 920), Image.Resampling.LANCZOS)
          top_x = (1800 - top_crop.width) // 2
          top_y = 250
          canvas.paste(top_crop, (top_x, top_y))

          # Width and height dimension arrows for the top view.
          left = top_x + 35
          right = top_x + top_crop.width - 35
          arrow_y = 205
          draw.line((left, arrow_y, right, arrow_y), fill='black', width=4)
          draw.polygon([(left, arrow_y), (left + 24, arrow_y - 12), (left + 24, arrow_y + 12)], fill='black')
          draw.polygon([(right, arrow_y), (right - 24, arrow_y - 12), (right - 24, arrow_y + 12)], fill='black')
          draw.text(((left + right) // 2 - 115, 125), '98.0 mm', fill='black', font=label_font)

          vertical_x = min(1720, right + 80)
          upper = top_y + 20
          lower = top_y + top_crop.height - 20
          draw.line((vertical_x, upper, vertical_x, lower), fill='black', width=4)
          draw.polygon([(vertical_x, upper), (vertical_x - 12, upper + 24), (vertical_x + 12, upper + 24)], fill='black')
          draw.polygon([(vertical_x, lower), (vertical_x - 12, lower - 24), (vertical_x + 12, lower - 24)], fill='black')
          draw.text((vertical_x - 40, (upper + lower) // 2 - 30), '68.0 mm', fill='black', font=label_font, anchor='rm')

          side_crop.thumbnail((1400, 650), Image.Resampling.LANCZOS)
          side_x = (1800 - side_crop.width) // 2
          side_y = 1540
          canvas.paste(side_crop, (side_x, side_y))

          thick_x = min(1710, side_x + side_crop.width + 70)
          thick_top = side_y + 100
          thick_bottom = side_y + side_crop.height - 80
          draw.line((thick_x, thick_top, thick_x, thick_bottom), fill='black', width=4)
          draw.polygon([(thick_x, thick_top), (thick_x - 12, thick_top + 24), (thick_x + 12, thick_top + 24)], fill='black')
          draw.polygon([(thick_x, thick_bottom), (thick_x - 12, thick_bottom - 24), (thick_x + 12, thick_bottom - 24)], fill='black')
          draw.text((thick_x - 35, (thick_top + thick_bottom) // 2), '18.5 mm', fill='black', font=label_font, anchor='rm')

          dimensions_name = 'serotonix-dimensions-hires.webp'
          dimensions_path = asset_dir / dimensions_name
          canvas = canvas.filter(ImageFilter.UnsharpMask(radius=0.9, percent=120, threshold=2))
          canvas.save(dimensions_path, 'WEBP', quality=95, method=6)
          output_sizes[dimensions_name] = canvas.size

          html_path = root / 'serotonix.html'
          html = html_path.read_text(encoding='utf-8')
          for source_name, target_name in mapping:
              html = html.replace(f'assets/{source_name}', f'assets/{target_name}')

          for target_name, (image_width, image_height) in output_sizes.items():
              pattern = rf'(<img src="assets/{re.escape(target_name)}" loading="lazy") width="\d+" height="\d+"'
              html = re.sub(pattern, rf'\1 width="{image_width}" height="{image_height}"', html)

          html = html.replace(
              'These visuals document an early productisation direction—from personalised facial geometry and flexible electronics to controller architecture, industrial design and finish exploration.',
              'These visuals document an early productisation direction—from personalised facial geometry and flexible electronics to controller architecture, industrial design, dimensions and finish exploration.'
          )

          if 'gallery.item7Title' not in html:
              card = f'''\n\n            <figure class="concept-card">\n              <a class="concept-card-media" href="assets/{dimensions_name}" target="_blank" rel="noreferrer">\n                <img src="assets/{dimensions_name}" loading="lazy" width="{output_sizes[dimensions_name][0]}" height="{output_sizes[dimensions_name][1]}" alt="Proposed SerotoniX product dimensions with top and side views">\n              </a>\n              <figcaption><span class="concept-card-index">07</span><div class="concept-card-copy"><h3 data-i18n="gallery.item7Title">Proposed dimensional envelope</h3><p data-i18n="gallery.item7Text">A preliminary dimensional study indicating an approximate 98 × 68 mm footprint and 18.5 mm profile. All dimensions remain subject to ergonomic and engineering validation.</p></div></figcaption>\n            </figure>'''
              marker = '            </figure>\n          </div>\n\n          <p class="concept-gallery-note"'
              html = html.replace(marker, '            </figure>' + card + '\n          </div>\n\n          <p class="concept-gallery-note"', 1)

          html_path.write_text(html, encoding='utf-8')

          i18n_path = root / 'serotonix-gallery-i18n.js'
          i18n = i18n_path.read_text(encoding='utf-8')
          if 'gallery.item7Title' not in i18n:
              i18n = i18n.replace(
                  '      "gallery.item6Text": "Three visual directions—white, graphite and sage—used to explore how the product might move from laboratory language toward a more approachable consumer-wellbeing identity.",',
                  '      "gallery.item6Text": "Three visual directions—white, graphite and sage—used to explore how the product might move from laboratory language toward a more approachable consumer-wellbeing identity.",\n      "gallery.item7Title": "Proposed dimensional envelope",\n      "gallery.item7Text": "A preliminary dimensional study indicating an approximate 98 × 68 mm footprint and 18.5 mm profile. All dimensions remain subject to ergonomic and engineering validation.",'
              )
              i18n = i18n.replace(
                  '      "gallery.item6Text": "白色、石墨灰与鼠尾草绿三种方向，用于探索产品如何从实验室语言转向更亲和的消费级身心健康形象。",',
                  '      "gallery.item6Text": "白色、石墨灰与鼠尾草绿三种方向，用于探索产品如何从实验室语言转向更亲和的消费级身心健康形象。",\n      "gallery.item7Title": "拟议尺寸范围",\n      "gallery.item7Text": "初步尺寸研究显示约 98 × 68 毫米的平面尺寸及 18.5 毫米的厚度。所有尺寸仍须经过人体工学与工程验证。",'
              )
              i18n = i18n.replace(
                  '      "gallery.item6Text": "ホワイト、グラファイト、セージの3案で、研究機器から親しみやすいウェルビーイング製品への表現を検討します。",',
                  '      "gallery.item6Text": "ホワイト、グラファイト、セージの3案で、研究機器から親しみやすいウェルビーイング製品への表現を検討します。",\n      "gallery.item7Title": "提案寸法レンジ",\n      "gallery.item7Text": "約98 × 68 mmの外形と18.5 mmの厚みを示す暫定寸法検討です。すべての寸法は人間工学・設計検証により確定します。",'
              )
              i18n_path.write_text(i18n, encoding='utf-8')
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/serotonix-*-hires.webp serotonix.html serotonix-gallery-i18n.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Replace SerotoniX gallery with high-resolution assets"
            git push origin HEAD:agent/serotonix-high-resolution-assets
          fi
