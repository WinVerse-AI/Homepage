          cards = [
              ("serotonix-product-cad-drawings-2026", "01", "Product CAD drawings", "Product-concept views of the exterior, interior, side, front and perspective mask form. These are rendered design studies, not controlled manufacturing CAD or evidence of tooling readiness.", "SerotoniX product CAD drawing board with exterior, interior, side, front and perspective mask views", "Open the supplied product CAD drawing board at full resolution", "is-wide"),
              ("serotonix-product-dimensions-2026", "02", "Proposed product dimensions", "A provisional dimensional envelope of 215 × 145 × 110 mm, with opening, strap and approximate 180 g target values. The numbers remain design inputs pending fit, tolerance and mass validation.", "SerotoniX product dimensions board with front, side, top, perspective and strap-detail views", "Open the supplied product dimensions board at full resolution", "is-wide"),
              ("serotonix-controller-pcba-drawings-2026", "03", "Controller PCBA drawings", "A controller-board concept covering component and solder sides, isometric layout, block diagram, electrical targets, connector pinouts, driver topology and four-layer stack. It is not a released fabrication package.", "SerotoniX controller PCBA board with layouts, block diagram, electrical targets, connector pinouts and layer stack", "Open the supplied controller PCBA board at full resolution", "is-wide"),
