name: Finalise supplied SerotoniX boards

on:
  push:
    branches: ["agent/serotonix-seven-source-boards"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalise-serotonix-source-boards
  cancel-in-progress: true

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/serotonix-seven-source-boards
          fetch-depth: 0

      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Verify sources and rebuild page
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          expected_sources = {
              "serotonix-colour-finish-options-2026": ("e01755a60eb6e7a0372315e112409b9cc96d436b9d6da0925960959c8fa4f6ca", 1024, 1536),
              "serotonix-illustrative-layered-architecture-2026": ("8286fed0148773d212ba19311205e9e4f402b1ab45b7a25de3a456573effbce7", 1536, 1024),
              "serotonix-system-schematic-2026": ("40cfac150641db93d37a9e1848d97ca2c98091f1af4653fee077fa28f5779efe", 1448, 1086),
              "serotonix-system-control-schematic-2026": ("4bf136c41e09ad27dc4c4b0f99af8317a271d53116be6f9d3e952a66677871df", 1448, 1086),
              "serotonix-product-dimensions-2026": ("a2b4841603c7387a6618392aca34f11ee906ed639879ea6e556e297bf71f908e", 1448, 1086),
              "serotonix-product-cad-drawings-2026": ("a0a27a6c07e941776805c4c35228bd8ea77c4c215f42b97b366966126b27c89a", 1448, 1086),
              "serotonix-controller-pcba-drawings-2026": ("86450e6cf529713fefcbf27b3951a9cf79abef667d79583b6bd4fdac847cc97b", 1536, 1024),
          }

          order = [
              ("serotonix-illustrative-layered-architecture-2026", "hero"),
              ("serotonix-product-cad-drawings-2026", "gallery"),
              ("serotonix-product-dimensions-2026", "gallery"),
              ("serotonix-controller-pcba-drawings-2026", "gallery"),
              ("serotonix-system-schematic-2026", "gallery"),
              ("serotonix-system-control-schematic-2026", "gallery"),
              ("serotonix-colour-finish-options-2026", "gallery"),
          ]

          report_path = Path("asset-fetch-report.json")
          if not report_path.is_file():
              raise SystemExit("Exact-source fetch report is absent; refusing to publish")
          fetch_report = json.loads(report_path.read_text(encoding="utf-8"))
          if not fetch_report.get("passed"):
              raise SystemExit("Exact-source fetch did not pass; refusing to publish")
          fetched = {item["id"]: item for item in fetch_report.get("boards", [])}
          if len(fetched) != 7 or any(not item.get("matched") for item in fetched.values()):
              raise SystemExit("Exact-source report does not contain seven matched boards")

          boards = []
          for name, role in order:
              source_sha, width, height = expected_sources[name]
              path = Path("assets") / f"{name}.webp"
              if not path.is_file():
                  raise SystemExit(f"Missing materialised board: {path}")
              data = path.read_bytes()
              with Image.open(path) as image:
                  image.load()
                  if image.format != "WEBP" or image.size != (width, height):
                      raise SystemExit(f"Invalid materialised board {path}: {image.format} {image.size}")
              boards.append({
                  "path": path.as_posix(),
                  "role": role,
                  "width": width,
                  "height": height,
                  "source_png_sha256": source_sha,
                  "webp_sha256": hashlib.sha256(data).hexdigest(),
