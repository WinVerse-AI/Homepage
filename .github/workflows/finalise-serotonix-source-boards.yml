          verifier = r'''#!/usr/bin/env python3
from __future__ import annotations
import argparse, hashlib, json, sys
from html.parser import HTMLParser
from pathlib import Path
from urllib.parse import urlsplit
from webp_integrity import inspect_webp

RETIRED = {
    "assets/serotonix-mask-hero-2026.webp",
    "assets/serotonix-concept-exploded-hires.webp",
    "assets/serotonix-controller-pcba-2026.webp",
    "assets/serotonix-system-schematic-hires.webp",
    "assets/serotonix-proposed-specifications-hires.webp",
    "assets/serotonix-colour-finish-2026.webp",
}

class Parser(HTMLParser):
    def __init__(self):
        super().__init__(); self.images=[]; self.links=[]
    def handle_starttag(self, tag, attrs):
        values={k:(v or "") for k,v in attrs}
        if tag == "img": self.images.append(values)
        elif tag == "a": self.links.append(values)

def local(value): return urlsplit(value).path.lstrip("/")

def main():
    ap=argparse.ArgumentParser(); ap.add_argument("--root",default="."); ap.add_argument("--require-pillow",action="store_true"); args=ap.parse_args()
    root=Path(args.root).resolve(); errors=[]
    manifest=json.loads((root/"assets/serotonix-source-manifest.json").read_text(encoding="utf-8"))
    boards=manifest["boards"]; expected=[b["path"] for b in boards]
    page=Parser(); page.feed((root/"serotonix.html").read_text(encoding="utf-8"))
    refs=[local(i.get("src","")) for i in page.images if "serotonix-" in i.get("src","")]
    if refs != expected: errors.append(f"ordered image set mismatch: expected {expected}, found {refs}")
    if len(refs) != len(set(refs)): errors.append("duplicate SerotoniX image references")
    by_src={local(i.get("src","")):i for i in page.images}
    links={local(a.get("href","")) for a in page.links if "serotonix-" in a.get("href","")}
    for board in boards:
        rel=board["path"]; path=root/rel
        if not path.is_file(): errors.append(f"missing {rel}"); continue
        data=path.read_bytes(); digest=hashlib.sha256(data).hexdigest()
        if digest != board["webp_sha256"]: errors.append(f"SHA-256 mismatch for {rel}")
        try: info=inspect_webp(data, require_pillow=args.require_pillow)
        except ValueError as exc: errors.append(f"cannot fully decode {rel}: {exc}"); continue
        if (info.width,info.height)!=(board["width"],board["height"]): errors.append(f"dimension mismatch for {rel}")
        image=by_src.get(rel)
        if not image: continue
        if not image.get("alt","").strip(): errors.append(f"missing alt text for {rel}")
        if image.get("width")!=str(board["width"]) or image.get("height")!=str(board["height"]): errors.append(f"HTML dimensions mismatch for {rel}")
        if board["role"]=="hero":
            if image.get("loading")!="eager" or image.get("fetchpriority")!="high": errors.append("hero must be eager/high priority")
        else:
            if image.get("loading")!="lazy": errors.append(f"gallery board not lazy-loaded: {rel}")
            if rel not in links: errors.append(f"missing full-resolution link: {rel}")
    for rel in RETIRED:
        if (root/rel).exists(): errors.append(f"retired displayed asset still present: {rel}")
        if rel in refs: errors.append(f"retired asset still referenced: {rel}")
    if errors:
        print("\n".join(f"ERROR: {e}" for e in errors),file=sys.stderr); return 1
    mode="RIFF and Pillow" if args.require_pillow else "RIFF"
    print(f"Verified {len(boards)} exact-manifest SerotoniX WebP boards with {mode} validation."); return 0
if __name__=="__main__": raise SystemExit(main())
'''
          Path("scripts/verify-serotonix-assets.py").write_text(verifier, encoding="utf-8")

