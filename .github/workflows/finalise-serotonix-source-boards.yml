from __future__ import annotations
import argparse, hashlib, json, os, time
from html.parser import HTMLParser
from pathlib import Path
from urllib.parse import urljoin, urlsplit
from urllib.request import Request, urlopen
from webp_integrity import inspect_webp

class Parser(HTMLParser):
    def __init__(self): super().__init__(); self.sources=[]
    def handle_starttag(self,tag,attrs):
        if tag=="img":
            src=dict(attrs).get("src") or ""
            if "serotonix-" in src: self.sources.append(urlsplit(src).path.lstrip("/"))

def fetch(url,timeout=30):
    sep="&" if "?" in url else "?"; req=Request(f"{url}{sep}verify={time.time_ns()}",headers={"User-Agent":"WinVerse-SerotoniX-Deployment-Check/3.0","Cache-Control":"no-cache, no-store"})
    with urlopen(req,timeout=timeout) as response: return response.status,{k.lower():v for k,v in response.headers.items()},response.read()

def main():
    ap=argparse.ArgumentParser(); ap.add_argument("--base-url",required=True); ap.add_argument("--root",default="."); ap.add_argument("--output",required=True); ap.add_argument("--attempts",type=int,default=18); ap.add_argument("--delay",type=int,default=10); args=ap.parse_args()
    root=Path(args.root).resolve(); base=args.base_url.rstrip("/")+"/"; page_url=urljoin(base,"serotonix.html")
    boards=json.loads((root/"assets/serotonix-source-manifest.json").read_text(encoding="utf-8"))["boards"]; expected=[b["path"] for b in boards]
    local_html=(root/"serotonix.html").read_bytes(); local_html_sha=hashlib.sha256(local_html).hexdigest(); failures=[]
