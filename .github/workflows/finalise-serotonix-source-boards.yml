              gallery.append(f'''            <figure class="concept-card {css_class}">
              <a class="concept-card-media" href="{path}?v={token[name]}" target="_blank" rel="noreferrer" aria-label="{aria}">
                <img src="{path}?v={token[name]}" loading="lazy" decoding="async" width="{board['width']}" height="{board['height']}" alt="{alt}">
              </a>
              <figcaption><span class="concept-card-index">{index}</span><div class="concept-card-copy"><h3 data-i18n="gallery.item{int(index)}Title">{title}</h3><p data-i18n="gallery.item{int(index)}Text">{text}</p></div></figcaption>
            </figure>''')
          gallery.append('''            <aside class="concept-analysis-card" aria-labelledby="development-questions-title">
              <p class="eyebrow" data-i18n="gallery.questionsEyebrow">Critical development questions</p>
              <h3 id="development-questions-title" data-i18n="gallery.questionsTitle">What must be resolved before the concept becomes a product.</h3>
              <ul>
                <li data-i18n="gallery.question1">Confirm whether the mechanism is facial-muscle FES, vagus-nerve stimulation or another form of neuromodulation; these are not interchangeable claims.</li>
