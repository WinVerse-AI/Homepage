name: Deploy GitHub Pages

# Pull requests validate repository assets. Main-branch pushes deploy and verify
# the exact HTML and fully decoded WebP bytes served by GitHub Pages.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Verify complete SerotoniX assets
        run: python3 scripts/verify-serotonix-assets.py --root . --require-pillow

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialise deployment evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deployment-verification
          git worktree add /tmp/serotonix-evidence-branch deployment-verification
          cat > /tmp/serotonix-evidence-branch/status.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "stage": "validation-started",
            "status": "running",
            "updated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git -C /tmp/serotonix-evidence-branch add status.json
          git -C /tmp/serotonix-evidence-branch commit -m "Start SerotoniX verification ${GITHUB_SHA}" || true
          git -C /tmp/serotonix-evidence-branch push origin deployment-verification

      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Verify complete committed SerotoniX assets
        run: python3 scripts/verify-serotonix-assets.py --root . --require-pillow

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact live page and fully decoded asset bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 scripts/verify-live-serotonix.py \
            --base-url "$PAGE_URL" \
            --root . \
            --output /tmp/serotonix-live-verification.json

      - name: Install browser verification runtime
        run: npm install --prefix /tmp/serotonix-playwright playwright-core@1.55.0

      - name: Capture and verify live desktop and mobile pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/capture-serotonix.js \
            "${PAGE_URL%/}/serotonix.html" \
            /tmp/serotonix-desktop.png \
            /tmp/serotonix-mobile.png \
            /tmp/serotonix-browser-verification.json

      - name: Publish successful deployment evidence
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          EVIDENCE=/tmp/serotonix-evidence-branch
          git -C "$EVIDENCE" rm -rf .
          cp /tmp/serotonix-live-verification.json "$EVIDENCE"/
          cp /tmp/serotonix-browser-verification.json "$EVIDENCE"/
          cp /tmp/serotonix-desktop.png "$EVIDENCE"/
          cp /tmp/serotonix-mobile.png "$EVIDENCE"/
          cat > "$EVIDENCE/status.json" <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/serotonix.html",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "stage": "live-browser-verification-complete",
            "status": "passed",
            "updated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat > "$EVIDENCE/README.md" <<EOF
          # SerotoniX deployment verification

          - Commit: \`${GITHUB_SHA}\`
          - Pages base URL: ${PAGE_URL}
          - Page: ${PAGE_URL%/}/serotonix.html
          - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The JSON reports contain exact HTML and asset byte hashes, strict RIFF
          container checks, full Pillow and browser decodes, natural and rendered
          dimensions, console and network results, language switching, mobile
          navigation and horizontal-overflow checks.
          EOF
          git -C "$EVIDENCE" add .
          git -C "$EVIDENCE" commit -m "Verify SerotoniX deployment ${GITHUB_SHA}"
          git -C "$EVIDENCE" push origin deployment-verification

      - name: Publish failed deployment evidence
        if: failure()
        run: |
          EVIDENCE=/tmp/serotonix-evidence-branch
          if ! git -C "$EVIDENCE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "Evidence worktree was not initialised; no failure record can be published."
            exit 0
          fi
          git -C "$EVIDENCE" rm -rf . || true
          for artifact in \
            /tmp/serotonix-live-verification.json \
            /tmp/serotonix-browser-verification.json \
            /tmp/serotonix-desktop.png \
            /tmp/serotonix-mobile.png
          do
            if [ -f "$artifact" ]; then
              cp "$artifact" "$EVIDENCE"/
            fi
          done
          cat > "$EVIDENCE/status.json" <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "stage": "workflow-failed",
            "status": "failed",
            "updated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git -C "$EVIDENCE" add .
          git -C "$EVIDENCE" commit -m "Record failed SerotoniX verification ${GITHUB_SHA}" || true
          git -C "$EVIDENCE" push origin deployment-verification || true
